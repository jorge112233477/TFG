<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Classroom IA</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="barra">
    <a href="inicio.html" class="marca marca-pequena enlace-marca">Classroom IA</a>
    <button id="boton-salir" class="boton-secundario">Cerrar sesión</button>
  </header>

  <main class="contenido">
    <h1>Usuarios del centro</h1>
    <p class="subtitulo">Escribe el correo de cada profesor y alumno. Les llegará una invitación para elegir su contraseña.</p>

    <form id="form-alta" class="form-alta" novalidate>
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" placeholder="nombre@correo.com" required>
      </div>
      <div class="campo">
        <label for="rol">Rol</label>
        <select id="rol">
          <option value="profesor">Profesor</option>
          <option value="alumno">Alumno</option>
        </select>
      </div>
      <button type="submit" id="boton-alta">Invitar</button>
    </form>
    <p id="mensaje" role="status" hidden></p>

    <h2>Usuarios invitados</h2>
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Correo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th><span class="solo-lector">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="lista-correos"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/usuarios.js"></script>
</body>
</html>
