<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Classroom IA</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="apple-touch-icon" href="img/logo-icono.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">

  <main class="tarjeta-login">
    <div class="logo logo-grande">
      <img src="img/logo.svg" alt="" width="48" height="48">
      <span class="logo-texto">Classroom</span><span class="logo-ia">IA</span>
    </div>

    <h1 class="titulo-login">Inicia sesión</h1>
    <p class="subtitulo">Entra con el correo que te dio tu centro.</p>

    <form id="form-login" novalidate>
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <p id="mensaje-error" class="error" role="alert" hidden></p>

      <button type="submit" id="boton-entrar">Entrar</button>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
