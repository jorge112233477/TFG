<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Classroom IA</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">

  <main class="tarjeta-login">
    <h1 class="marca">Classroom IA</h1>
    <p class="subtitulo">Entra con el correo que te dio tu centro.</p>

    <form id="form-login" novalidate>
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <p id="mensaje-error" class="error" role="alert" hidden></p>

      <button type="submit" id="boton-entrar">Entrar</button>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
